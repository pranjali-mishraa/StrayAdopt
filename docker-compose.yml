services:
  redis:
    image: redis:7-alpine
    container_name: strayadopt-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: strayadopt-app

    ports:
      - "8000:8000"

    depends_on:
      - redis

    environment:
      - REDIS_URL=redis://redis:6379

    env_file:
      - ./backend/.env 

volumes:
  redis-data: